{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="narrow">
  <div class="page-heading"><div><p class="eyebrow">账号安全</p><h1>修改密码</h1><p>首次登录需要设置一个只有你知道的新密码。</p></div></div>
  <form method="post" class="panel form-panel">{% csrf_token %}
    {{ form.as_p }}
    <button class="button primary" type="submit">保存新密码</button>
  </form>
</div>
{% endblock %}
