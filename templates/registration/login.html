{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<section class="login-shell">
  <div class="login-intro">
    <span class="brand-mark large">招</span>
    <p class="eyebrow">招生就业处</p>
    <h1>教师选课系统</h1>
    <p>请使用管理员分配的账号登录。</p>
  </div>
  <form method="post" class="panel login-form">
    {% csrf_token %}
    <h2>账号登录</h2>
    {% if form.non_field_errors %}<div class="field-error">账号或密码不正确，请重新输入。</div>{% endif %}
    <label for="id_username">登录账号</label>
    <input id="id_username" name="username" autocomplete="username" autofocus required>
    <label for="id_password">密码</label>
    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="button primary wide" type="submit">登录</button>
  </form>
</section>
{% endblock %}
