{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<section class="login-shell">
  <div class="login-intro">
    <span class="login-mark" aria-hidden="true">招</span>
    <p class="login-identity">西南科技大学 · 招生就业处</p>
    <h1>选课系统</h1>
    <p class="login-description">登录后即可查看并选择开放课程</p>
  </div>

  <form method="post" class="login-form" data-login-form>
    {% csrf_token %}
    <header class="login-card-heading"><h2>账号登录</h2><p>使用管理员分配的账号进入系统</p></header>
    <div class="login-error-slot" aria-live="polite">{% if form.non_field_errors %}<p class="login-error">账号或密码错误，请重新输入。</p>{% endif %}</div>
    <div class="login-field">
      <label for="id_username">账号</label>
      <input id="id_username" name="username" type="text" autocomplete="username" placeholder="请输入账号" autofocus required>
    </div>
    <div class="login-field">
      <label for="id_password">密码</label>
      <div class="password-field">
        <input id="id_password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
        <button class="password-toggle" type="button" data-password-toggle aria-controls="id_password" aria-pressed="false">显示</button>
      </div>
    </div>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button class="login-submit" type="submit" data-login-button><span data-login-label>登录</span><span class="login-spinner" aria-hidden="true"></span></button>
  </form>
</section>
{% endblock %}
